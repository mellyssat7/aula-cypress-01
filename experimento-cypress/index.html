<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Lista de tarefas</h1>

        <form id="task-form">
            <label for="task-input">Nova tarefa</label>
            <div class="form-row">
                <input type="text" id="task-input" data-cy="task-input" placeholder="Digite uma tarefa...">
                <button type="submit" data-cy="add-button">Adicionar</button>
            </div>
            <p id="error-message" class="error" data-cy="error-message"></p>
        </form>

        <button id="remove-all-button" data-cy="remove-all-button" style="margin: 10px 0;">Remover todas</button>
        <p id="empty-message" data-cy="empty-message" style="display: none; color: #666;">Nenhuma tarefa cadastrada.</p>

        <ul id="task-list" data-cy="task-list"></ul>

        <p>Total de tarefas: <span id="task-count" data-cy="task-count">0</span></p>
    </div>

    <script src="app.js"></script>
</body>

</html>
